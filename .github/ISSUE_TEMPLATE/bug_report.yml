name: Problem report
description: Something in NOTCH didn't work the way you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing NOTCH. The more of this you can fill in, the faster the problem can be found.
        Be aware that the log files list the mods you have installed and the folders they are in.
  - type: dropdown
    id: side
    attributes:
      label: Where did the problem happen?
      options:
        - In my game (I was a player)
        - On my server (I manage it)
        - Both / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NOTCH version
      description: From the first NOTCH line in BepInEx/LogOutput.log, for example "v0.11.1".
      placeholder: v0.11.1
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What did you do, and what happened?
      description: The steps, in order, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Player's report file
      description: Paste or attach BepInEx/NOTCH/notch-checks.yaml from the player's game folder.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Log files
      description: >
        Attach BepInEx/LogOutput.log from the player's game, the server, or both.
        A server log made with Debug = true in com.skyraze.notch.cfg helps most.
  - type: textarea
    id: mods
    attributes:
      label: Anything else?
      description: Other mods involved, the server's Policy setting, screenshots.
